[client]
toolbarMode = "minimal"
showErrorDetails = "type"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

# ---------------------------------------------------------------------------
# Theme: locked matte dark ("quant desk x industrial hardware").
# Base font is a monospace (JetBrains Mono) so every number, table and input
# reads as instrument output; Inter is used for headings and short prose.
# Tokens are mirrored in app/theme.py for Plotly charts and CSS.
# ---------------------------------------------------------------------------
[theme]
base = "dark"
primaryColor = "#FF5500"
backgroundColor = "#0A0A0B"
secondaryBackgroundColor = "#161619"
textColor = "#F4F4F6"
borderColor = "#222226"
linkColor = "#FF5500"
greenColor = "#00E676"
redColor = "#FF3B30"
orangeColor = "#FF5500"
yellowColor = "#FFB800"
font = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
baseFontSize = 13
baseRadius = "2px"
buttonRadius = "2px"
headingFontWeights = [600, 600, 600, 600, 600, 600]
headingFontSizes = ["1.4rem", "1.1rem", "0.95rem", "0.9rem", "0.85rem", "0.8rem"]
showWidgetBorder = true
showSidebarBorder = true
dataframeBorderColor = "#222226"
dataframeHeaderBackgroundColor = "#111113"
