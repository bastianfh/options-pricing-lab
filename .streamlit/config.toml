[client]
toolbarMode = "minimal"
showErrorDetails = "type"

[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

# ---------------------------------------------------------------------------
# Theme. Shared settings live in [theme]; colours are set per mode. The same
# tokens are mirrored in app/theme.py for Plotly charts and CSS.
# ---------------------------------------------------------------------------
[theme]
# One family, Archivo, with its width axis as the expressive variable:
# headings are set semi-expanded, body text at normal width.
font = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
headingFont = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
codeFont = "monospace"
baseFontSize = 15
baseRadius = "6px"
buttonRadius = "6px"
headingFontWeights = [640, 620, 600, 600, 600, 600]
headingFontSizes = ["2.3rem", "1.5rem", "1.15rem", "1.05rem", "1rem", "0.9rem"]
showWidgetBorder = true
showSidebarBorder = false

# Light: cool paper, slate ink, petrol accent. Green/red only for gains/losses.
[theme.light]
primaryColor = "#0d5c61"
backgroundColor = "#f5f7f6"
secondaryBackgroundColor = "#e9eeec"
textColor = "#16212a"
borderColor = "#d5ddda"
linkColor = "#0d5c61"
greenColor = "#1f7a4d"
redColor = "#b42318"
blueColor = "#2a78d6"
dataframeHeaderBackgroundColor = "#edf1ef"

[theme.light.sidebar]
backgroundColor = "#e9eeec"
secondaryBackgroundColor = "#dfe6e3"

# Dark: deep petrol-slate rather than neutral black.
[theme.dark]
primaryColor = "#5fb4ae"
backgroundColor = "#0e1517"
secondaryBackgroundColor = "#182225"
textColor = "#e1e7e5"
borderColor = "#26343a"
linkColor = "#7cc6c0"
greenColor = "#45b880"
redColor = "#ef7468"
blueColor = "#3987e5"
dataframeHeaderBackgroundColor = "#141d20"

[theme.dark.sidebar]
backgroundColor = "#121b1d"
secondaryBackgroundColor = "#1c2629"
